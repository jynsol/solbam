<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>솔밤배 · 공격 시안</title><style>*{box-sizing:border-box}body{background:#111522;color:#fff1d7;font:16px system-ui;margin:auto;max-width:560px;padding:16px}h1{font-size:23px}figure{margin:12px 0}figcaption{margin:5px;font-weight:700}canvas{width:100%;display:block;image-rendering:pixelated;background:#1a2132;border:2px solid #48506a}</style><h1>솔밤배 · 공격 이펙트 시안</h1><p>같은 타격을 동시에 반복해요.</p><main></main><script>
(async()=>{
const images=await Promise.all(['player-winter-v1','en_fuzz-christmas-v1','monster-poses','trees/large_green'].map(async name=>{const im=new Image();im.src='img/'+name+'.png';await im.decode();return im}));
const names=['1 · 홍련 사선참','2 · 서리 올려베기','3 · 금빛 교차참'];
const contexts=names.map(name=>{const f=document.createElement('figure');f.innerHTML='<figcaption>'+name+'</figcaption><canvas width="180" height="88"></canvas>';document.querySelector('main').append(f);return f.querySelector('canvas').getContext('2d')});
const clamp=v=>Math.max(0,Math.min(1,v));
const looks=[
  {start:-1.28,end:.85,color:'#dc627e',light:'#ffc486'},
  {start:1.08,end:-1.20,color:'#5897bf',light:'#b9f4ff'},
  {start:-1.18,end:1.02,color:'#d9944c',light:'#ffe599'}
];
function pixel(g,x,y,color,size=1){
  g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),size,size);
}
function stroke(g,x,y,X,Y,color,width=1){
  const steps=Math.max(1,Math.ceil(Math.hypot(X-x,Y-y)));
  for(let i=0;i<=steps;i++)pixel(g,x+(X-x)*i/steps,y+(Y-y)*i/steps,color,width);
}
function swing(g,t,look,showBlade){
  if(t<0||t>.97)return;
  // The blade reaches the cookie at angle zero. Briefly hold the contact frame.
  const advance=t<.12?t/.12:t<.19?1:1+clamp((t-.19)/.13);
  const angle=advance<1?look.start*(1-advance):look.end*(advance-1);
  const gripX=82,gripY=56,length=37;
  const fade=1-clamp((t-.25)/.72);
  g.save();
  for(let i=0;i<=80;i++){
    const u=i/80,a=look.start+(angle-look.start)*u;
    const width=Math.sin(Math.PI*u)*8*fade+.7;
    g.globalAlpha=fade*(.16+.78*u);
    for(let d=0;d<width;d+=.65){
      const r=length-d;
      pixel(g,gripX+Math.cos(a)*r,gripY+Math.sin(a)*r,d<1?'#fff6db':d<2.5?look.light:look.color);
    }
  }
  g.restore();
  if(showBlade&&t<.45){
    const dx=Math.cos(angle),dy=Math.sin(angle);
    for(let r=-3;r<=length;r++){
      const x=gripX+dx*r,y=gripY+dy*r;
      pixel(g,x,y,r<2?'#8a5649':'#738299',r<2?2:3);
      if(r>1)pixel(g,x-dy,y+dx,r>length-4?'#fff9da':'#e3f5f5');
    }
    stroke(g,gripX-dy*4,gripY+dx*4,gripX+dy*4,gripY-dx*4,'#efbb60',2);
  }
  const age=t-.12;
  if(age<0)return;
  const sign=Math.sign(look.end),x=109,y=56,travel=1-Math.exp(-age*12);
  g.save();g.globalAlpha=1-clamp(age/.68);
  // Thin cut scar and tapered directional splinters follow the swing tangent.
  stroke(g,x-8,y-11*sign,x+10,y+13*sign,look.color,3);
  stroke(g,x-8,y-11*sign,x+10,y+13*sign,look.light);
  for(let i=0;i<11;i++){
    const a=sign*(.38+(i%5)*.29),dist=travel*(9+(i*7)%25);
    const sx=x+Math.cos(a)*dist,sy=y+Math.sin(a)*dist+age*age*12;
    const tail=(1-travel)*7+2;
    stroke(g,sx,sy,sx-Math.cos(a)*tail,sy-Math.sin(a)*tail,i%3?look.light:'#fff8df');
    if(i%4===0&&age>.24)pixel(g,sx,sy-1,look.color,2);
  }
  g.restore();
}
function frame(ms){
  const t=ms%2250/1000-.4;
  contexts.forEach((g,k)=>{
    g.imageSmoothingEnabled=false;g.globalAlpha=1;g.fillStyle='#192033';g.fillRect(0,0,180,88);
    for(let j=0;j<7;j++)g.drawImage(images[3],j*30-9,24,30,45);
    g.fillStyle='#a4bbd2';g.fillRect(0,68,180,20);
    const second=k===2&&t>=.32,local=second?t-.32:t;
    const pose=local<-.15?0:local<0?8:local<.28?9:local<.52?10:0;
    const recoil=local>=.12&&local<.43?Math.sin(Math.PI*(local-.12)/.31):0;
    g.drawImage(images[0],pose*96,0,96,96,55,36,32,32);
    if(recoil)g.drawImage(images[2],0,0,72,84,98+Math.round(4*recoil),40,24,28);
    else g.drawImage(images[1],98,40,24,28);
    swing(g,t,looks[k],!second);
    if(second)swing(g,local,{...looks[2],start:.98,end:-1.23},true);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);})();
</script></html>
