<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>솔밤배 · 공격 시안</title><style>*{box-sizing:border-box}body{background:#111522;color:#fff1d7;font:16px system-ui;margin:auto;max-width:560px;padding:16px}h1{font-size:23px}figure{margin:12px 0}figcaption{margin:5px;font-weight:700}canvas{width:100%;display:block;image-rendering:pixelated;background:#1a2132;border:2px solid #48506a}</style><h1>솔밤배 · 공격 이펙트 시안</h1><p>같은 타격을 동시에 반복해요.</p><main></main><script>
(async()=>{
const images=await Promise.all(['player-winter-v1','en_fuzz-christmas-v1','monster-poses','trees/large_green'].map(async name=>{const im=new Image();im.src='img/'+name+'.png';await im.decode();return im}));
const names=['1 · 페퍼민트 리본','2 · 눈꽃 도장','3 · 별자리 폭죽'];
const contexts=names.map(name=>{const f=document.createElement('figure');f.innerHTML='<figcaption>'+name+'</figcaption><canvas width="180" height="88"></canvas>';document.querySelector('main').append(f);return f.querySelector('canvas').getContext('2d')});
const star=['00100','01110','11111','01110','10101'],snow=['10101','01110','11211','01110','10101'];
function stamp(g,x,y,size,pattern,color){g.fillStyle=color;pattern.forEach((row,j)=>[...row].forEach((v,i)=>{if(v!=='0')g.fillRect(Math.round(x+(i-2)*size),Math.round(y+(j-2)*size),size,size)}))}
// All three studies share a strike point and clock. Each has its own silhouette.
function pixelLine(g,x,y,X,Y,color,width=1){
  const steps=Math.max(1,Math.ceil(Math.hypot(X-x,Y-y)));
  g.fillStyle=color;
  for(let i=0;i<=steps;i++)g.fillRect(Math.round(x+(X-x)*i/steps),Math.round(y+(Y-y)*i/steps),width,width);
}
function flourish(g,kind,t){
  if(t<0||t>1.55)return;
  const x=105,y=38,open=1-Math.exp(-7*t);
  g.save();g.globalAlpha=Math.min(1,(1.55-t)*2);
  if(kind===0){
    // Two twisting tails of a peppermint bow.
    for(const side of [-1,1]){
      let prev=[x,y];
      for(let i=1;i<=48;i++){const u=i/48*open;
        const point=[x+side*(34*u+8*Math.sin(u*6.28)),y-16*Math.sin(u*5.2)-10*u+5*u*Math.sin(t*5)];
        pixelLine(g,...prev,...point,'#9a4857',4);
        pixelLine(g,...prev,...point,i%10<5?'#ff9eab':'#fff0c7',3);
        pixelLine(g,prev[0],prev[1]-1,point[0],point[1]-1,'#efbf79');
        prev=point;
      }
      stamp(g,...prev,1.4,star,'#fff1aa');
    }
  }else if(kind===1){
    // Six growing crystal facets with mirrored fern-like branches.
    for(let j=0;j<6;j++){const a=j*Math.PI/3-.28;
      const point=(r,offset=0)=>[x+r*Math.cos(a)-offset*Math.sin(a),y+r*Math.sin(a)+offset*Math.cos(a)];
      const radius=28*open;
      pixelLine(g,...point(0),...point(radius),'#76aecf',3);
      pixelLine(g,...point(0),...point(radius),'#e6ffff');
      for(const root of [8,16])for(const side of [-1,1]){
        const length=Math.max(0,Math.min(8,radius-root));
        pixelLine(g,...point(root),...point(root+length,length*side),'#a5e6f4',2);
      }
      stamp(g,...point(radius+2),1,star,'#ffffff');
    }
  }else{
    // Golden comets burst into smaller rose and gold stars.
    for(let j=0;j<9;j++){const a=j*2*Math.PI/9-.9;
      const tip=u=>[x+Math.cos(a)*36*u,y+Math.sin(a)*29*u-7*u+8*u*u];
      pixelLine(g,...tip(Math.max(0,open-.18)),...tip(open),'#f6bf76',2);
      const [cx,cy]=tip(open);stamp(g,cx,cy,1.3,star,'#fff4b5');
      if(t>.23){const spread=1-Math.exp(-4*(t-.23));
        for(let k=0;k<4;k++){const angle=a+k*Math.PI/2;
          stamp(g,cx+Math.cos(angle)*9*spread,cy+Math.sin(angle)*9*spread+6*t*t,.8,star,k%2?'#ffb5bc':'#ffe599');}}
    }
  }
  // Drifting embers trail the expanding motif, then blink out individually.
  for(let j=0;j<18;j++){const age=t-.12-(j%5)*.045;if(age<0)continue;
    const angle=j*2.4,r=(12+j%7*3)*(1-Math.exp(-4*age));
    g.globalAlpha=Math.max(0,1-age/1.25)*(.65+.35*Math.cos(age*9+j));
    stamp(g,x+Math.cos(angle)*r,y+Math.sin(angle)*r+age*age*11,.75,j%3?star:snow,j%2?'#fff2cd':'#c8ebf5');
  }
  g.restore();
}
function frame(ms){const t=(ms%2450)/1000;contexts.forEach((g,k)=>{g.imageSmoothingEnabled=false;g.globalAlpha=1;g.setTransform(1,0,0,1,0,0);g.fillStyle='#192033';g.fillRect(0,0,180,88);g.translate(0,15);for(let j=0;j<7;j++)g.drawImage(images[3],j*30-9,9,30,45);g.fillStyle='#a4bbd2';g.fillRect(0,53,180,20);const hit=t-.42;const pose=t<.25?0:t<.38?8:t<.55?9:t<.66?10:0;g.drawImage(images[0],pose*96,0,96,96,53,21,32,32);if(hit>=0&&hit<.32)g.drawImage(images[2],0,0,72,84,98,25,24,28);else g.drawImage(images[1],98,25,24,28);
if(t>.28&&t<.65){const head=Math.min(1,(t-.28)/.14),tail=Math.max(0,(t-.42)/.23);for(let j=Math.ceil(tail*30);j<=head*30;j++){const u=j/30;g.fillStyle=k===0?(j%7<4?'#ee7586':'#fff2cb'):k===1?'#b7eafa':'#ffd978';g.fillRect(Math.round(76+29*u),Math.round(40-11*Math.sin(Math.PI*u)),2,k===0?3:1)}}
if(hit>=0&&hit<1.1){const u=hit/1.1,e=1-(1-u)**3;g.globalAlpha=Math.min(1,(1-u)*2);if(k===1){for(let j=0;j<6;j++){const a=j*Math.PI/3;for(let d=0;d<16*e;d++){const x=105+Math.cos(a)*d,y=39+Math.sin(a)*d;g.fillStyle='#d5f5ff';g.fillRect(Math.round(x),Math.round(y),1,1);if(d===8||d===9)for(const side of [-1,1])for(let n=1;n<4;n++)g.fillRect(Math.round(x+Math.cos(a+side*.9)*n),Math.round(y+Math.sin(a+side*.9)*n),1,1)}}}else{const points=[];for(let j=0;j<(k===0?6:8);j++){const a=j*(k===0?1.04:.78)-2.4;const r=e*(k===0?13:21)*(j%2?.8:1);points.push([105+Math.cos(a)*r,39+Math.sin(a)*r-5*e+7*u*u])}if(k===2){g.strokeStyle='#b78c50';g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.stroke()}points.forEach(([x,y],i)=>stamp(g,x,y,1,star,k===0&&i%2?'#ffabb7':'#ffe09a'))}stamp(g,105,39,Math.max(1,Math.round(2*(1-e))),k===1?snow:star,'#fff2ce')}g.globalAlpha=1;flourish(g,k,hit)});requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></html>
