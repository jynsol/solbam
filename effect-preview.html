<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>솔밤배 · 공격 시안</title><style>*{box-sizing:border-box}body{background:#111522;color:#fff1d7;font:16px system-ui;margin:auto;max-width:560px;padding:16px}h1{font-size:23px}figure{margin:12px 0}figcaption{margin:5px;font-weight:700}canvas{width:100%;display:block;image-rendering:pixelated;background:#1a2132;border:2px solid #48506a}</style><h1>솔밤배 · 공격 이펙트 시안</h1><p>같은 타격을 동시에 반복해요.</p><main></main><script>
(async()=>{
const images=await Promise.all(['player-winter-v1','en_fuzz-christmas-v1','monster-poses','trees/large_green'].map(async name=>{const im=new Image();im.src='img/'+name+'.png';await im.decode();return im}));
const names=['1 · 페퍼민트 리본','2 · 눈꽃 도장','3 · 별자리 폭죽'];
const contexts=names.map(name=>{const f=document.createElement('figure');f.innerHTML='<figcaption>'+name+'</figcaption><canvas width="180" height="62"></canvas>';document.querySelector('main').append(f);return f.querySelector('canvas').getContext('2d')});
const star=['00100','01110','11111','01110','10101'],snow=['10101','01110','11211','01110','10101'];
function stamp(g,x,y,size,pattern,color){g.fillStyle=color;pattern.forEach((row,j)=>[...row].forEach((v,i)=>{if(v!=='0')g.fillRect(Math.round(x+(i-2)*size),Math.round(y+(j-2)*size),size,size)}))}
function frame(ms){const t=(ms%2100)/1000;contexts.forEach((g,k)=>{g.imageSmoothingEnabled=false;g.globalAlpha=1;g.fillStyle='#192033';g.fillRect(0,0,180,62);for(let j=0;j<7;j++)g.drawImage(images[3],j*30-9,9,30,45);g.fillStyle='#a4bbd2';g.fillRect(0,53,180,9);const hit=t-.42;const pose=t<.25?0:t<.38?8:t<.55?9:t<.66?10:0;g.drawImage(images[0],pose*96,0,96,96,53,21,32,32);if(hit>=0&&hit<.32)g.drawImage(images[2],0,0,72,84,98,25,24,28);else g.drawImage(images[1],98,25,24,28);
if(t>.28&&t<.65){const head=Math.min(1,(t-.28)/.14),tail=Math.max(0,(t-.42)/.23);for(let j=Math.ceil(tail*30);j<=head*30;j++){const u=j/30;g.fillStyle=k===0?(j%7<4?'#ee7586':'#fff2cb'):k===1?'#b7eafa':'#ffd978';g.fillRect(Math.round(76+29*u),Math.round(40-11*Math.sin(Math.PI*u)),2,k===0?3:1)}}
if(hit>=0&&hit<1.1){const u=hit/1.1,e=1-(1-u)**3;g.globalAlpha=Math.min(1,(1-u)*2);if(k===1){for(let j=0;j<6;j++){const a=j*Math.PI/3;for(let d=0;d<16*e;d++){const x=105+Math.cos(a)*d,y=39+Math.sin(a)*d;g.fillStyle='#d5f5ff';g.fillRect(Math.round(x),Math.round(y),1,1);if(d===8||d===9)for(const side of [-1,1])for(let n=1;n<4;n++)g.fillRect(Math.round(x+Math.cos(a+side*.9)*n),Math.round(y+Math.sin(a+side*.9)*n),1,1)}}}else{const points=[];for(let j=0;j<(k===0?6:8);j++){const a=j*(k===0?1.04:.78)-2.4;const r=e*(k===0?13:21)*(j%2?.8:1);points.push([105+Math.cos(a)*r,39+Math.sin(a)*r-5*e+7*u*u])}if(k===2){g.strokeStyle='#b78c50';g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.stroke()}points.forEach(([x,y],i)=>stamp(g,x,y,1,star,k===0&&i%2?'#ffabb7':'#ffe09a'))}stamp(g,105,39,Math.max(1,Math.round(2*(1-e))),k===1?snow:star,'#fff2ce')}g.globalAlpha=1});requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></html>
